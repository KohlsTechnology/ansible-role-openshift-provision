---
oc_cmd_base: oc

openshift_resource_path:
- "{{ playbook_dir }}"

openshift_provision_change_record: ''

openshift_provision_cluster_vars: {}

generate_resources: false

# When true, provisioning failures are collected into facts and reported
# by the caller instead of failing the play
openshift_provision_report_only: false
provision_defer_unavailable_kinds: false

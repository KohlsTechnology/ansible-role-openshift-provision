---
- name: Provision cluster resources
  openshift_provision:
    connection:
      oc_cmd: "{{ oc_cmd }}"
    resources: "{{ resource_list }}"
    generate_resources: "{{ generate_resources }}"
    defer_unavailable_kinds:
      "{{ provision_defer_unavailable_kinds | default(false) }}"
    available_kinds: "{{ openshift_api_kinds | default([]) }}"
  register: provision
  changed_when: >-
    provision.results | default([], true)
    | record_change_provision_batch(change_record)
  ignore_errors: true
- name: Record new failures
  set_fact:
    provision_failures: >-
      {{ provision_failures
         + (provision.results | default([], true)
            | selectattr('failed', 'defined')
            | selectattr('failed', 'equalto', true)
            | map('record_failure')
            | list) }}
- name: Record deferred resources
  set_fact:
    provision_deferred_count: >-
      {{ (provision_deferred_count | default(0) | int)
         + (provision.deferred_count | default(0) | int) }}
- set_fact:
    provision_failures_skipped: "{{ provision_failures_skipped + [provision] }}"
  when: "'results' not in provision"

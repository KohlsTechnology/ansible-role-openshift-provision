---
## DESCRIPTION
#
# Process template and instantiate objects.
#
# Called from tasks/project.yml
#
## VARIABLES
#
# `project` - project in which to process template with keys:
#   `name` - project name
#
# `template` - template information with keys:
#   `action` - provision action (optional, default: 'apply')
#   `name` - template name (optional)
#   `namespace` - template namespace (optional)
#   `file` - template source file (optional)
#   `parameters` - parameters to pass to template (optional)
#   `url` - template source URL (optional)
#

- name: Create temporary directory for template
  tempfile:
    state: directory
  register: tempfile
  when: template.file is defined and template.file != ''
  check_mode: false
  changed_when: false

- name: Copy template
  copy:
    src: "{{ template.file }}"
    dest: "{{ tempfile.path }}"
  when: >-
    template.file is defined and
    template.file != '' and
    not template.file is match('(https?|ftp)://.*')
  check_mode: false
  changed_when: false

- name: Download template
  get_url:
    url: "{{ template.file }}"
    dest: "{{ tempfile.path }}"
  when: >-
    template.file is defined and
    template.file is match('(https?|ftp)://.*')
  check_mode: false
  changed_when: false

- name: Process template
  command: >-
    {{ oc_cmd }} process -o json
    {% if template.file is defined %}
    -f {{ tempfile.path }} --local
    {% else %}
    -n {{ template.namespace
      | default(project.name if project is defined else 'openshift') }}
    {{ template.name }}
    {% endif %}
    {% if template.parameters is defined %}
    {% for key, value in template.parameters.items() %}
    -p {{ (key ~ '=' ~ value) | quote }}
    {% endfor %}
    {% endif %}
  check_mode: false
  changed_when: false
  register: process_template

- name: Template resources
  openshift_provision:
    connection:
      oc_cmd: "{{ oc_cmd }}"
    namespace: "{{ project.name if project is defined else '' }}"
    resources: "{{ template_resource_list }}"
    default_action: "{{ template.action | default(omit) }}"
    default_patch_type: "{{ template.patch_type | default(omit) }}"
    generate_resources: "{{ generate_resources }}"
  register: provision
  changed_when: >-
    provision.results | default([], true)
    | record_change_provision_batch(change_record)
  ignore_errors: true
- name: Record new failures for template resources
  set_fact:
    provision_failures: >-
      {{ provision_failures
         + (provision.results | default([], true)
            | selectattr('failed', 'defined')
            | selectattr('failed', 'equalto', true)
            | map('record_failure')
            | list) }}
- set_fact:
    provision_failures_skipped: "{{ provision_failures_skipped + [provision] }}"
  when: "'results' not in provision"

- name: Cleanup temporary directory for template
  file:
    path: "{{ tempfile.path }}"
    state: absent
  register: tempfile
  when: template.file is defined
  check_mode: false
  changed_when: false

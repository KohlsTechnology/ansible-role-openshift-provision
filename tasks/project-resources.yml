---
- name: Provision resources in {{ project.name }}
  openshift_provision:
    action: "{{ provision_action }}"
    patch_type: >-
      {{
      item | json_query('metadata.annotations."openshift-provision/patch-type"')
      | default(item.patch_type, true)
      | default('strategic', true)
      }}
    connection:
      oc_cmd: "{{ oc_cmd }}"
    namespace: "{{ project.name }}"
    resource: "{{ item }}"
    generate_resources: "{{ generate_resources }}"
  loop: "{{ resource_list }}"
  vars:
    provision_action: >-
      {{
      item | json_query('metadata.annotations."openshift-provision/action"')
      | default(item.action, true)
      | default('apply', true)
      }}
  when: provision_action != 'ignore'
  register: provision
  changed_when: >-
    provision | record_change_provision(change_record)
  ignore_errors: True
- set_fact:
    provision_failures: "{{ provision_failures + provision.results }}"
  when: "'failed' in provision and 'results' in provision"
- set_fact:
    provision_failures_skipped: "{{ provision_failures_skipped + [provision] }}"
  when: "'results' not in provision"
